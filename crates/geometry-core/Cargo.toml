[package]
name = "kentos-geometry-core"
description = "Pure analytic CAD geometry shared by the browser (WASM) and the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure dependencies only: this crate must build for every target (native,
# wasm32) and never reach for the file system, the network or a runtime
# (CLAUDE.md §14). rust_decimal carries exact decimals for the numeric
# policy (§23); it is pure Rust.
[dependencies]
rust_decimal = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
