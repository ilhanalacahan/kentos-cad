# KentOS Rust workspace (CLAUDE.md §14): the shared analytic core (native and
# WASM), versioned contracts, and the server. The browser app stays in src/.
[workspace]
resolver = "3"
members = ["crates/contracts", "crates/geometry-core", "crates/wasm", "apps/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

# Exact versions: adding or bumping a dependency is a decision (CLAUDE.md §3).
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
wasm-bindgen = "=0.2.128"
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[profile.release]
lto = "thin"
codegen-units = 4
